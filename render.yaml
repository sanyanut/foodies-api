# Render Blueprint — deploys the Foodies API as a NODE web service (NOT Docker)
# plus a managed PostgreSQL database.
#
# The Dockerfile / docker-compose.yml in this repo are for LOCAL development
# only; Render ignores them because `runtime: node` is set explicitly here and
# builds/runs straight from the commands below.
services:
  - type: web
    name: foodies-api
    runtime: node
    plan: free
    region: frankfurt
    # `prisma`/`tsx` are in dependencies (not devDependencies) so they survive
    # `npm install` under NODE_ENV=production. migrate deploy is idempotent.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodies-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # REQUIRED in prod: set to the exact Vercel URL (e.g. https://foodies.vercel.app).
      # Leaving it empty means "allow all origins", which breaks the credentialed
      # refresh cookie (SameSite=None needs a specific origin). Set in dashboard.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: POPULAR_RECIPES_CACHE_TTL
        value: "60"
      # Cloudinary — set these in the Render dashboard.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: foodies-db
    plan: free
    databaseName: foodies
    user: foodies
    region: frankfurt
